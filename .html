<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-commerce Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">ShopMart</div>
        <div class="cart">
            <span id="cart-count">0</span> items in cart
        </div>
    </header>

    <main>
        <section class="products">
            <div class="product" data-id="1">
                <img src="C:\Users\it2140\Downloads\sheos.jpg" width="300" height="150" alt="Product 1">
                <h3>Product 1</h3>
                <p>$19.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

            <div class="product" data-id="2">
                <img src="C:\Users\it2140\Downloads\watch.png" width="300" height="150" alt="Product 2">
                <h3>Product 2</h3>
                <p>$29.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

            <div class="product" data-id="3">
                <img src="C:\Users\it2140\Downloads\watch.png" width="300" height="150" alt="Product 3">
                <h3>Product 3</h3>
                <p>$39.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </section>

        <section class="cart-items">
            <h2>Your Cart</h2>
            <ul id="cart-list">
                <!-- Cart items will be displayed here -->
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 ShopMart</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
